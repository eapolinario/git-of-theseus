[workspace]
resolver = "2"
members = [
    "crates/got-core",
    "crates/got-cli",
    "crates/got-plot",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eapolinario/git-of-theseus"
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.19", default-features = false, features = ["https"] }
# Pinned to the exact libgit2-sys version pulled in by `git2` above, so
# Cargo resolves both to the same build of libgit2 instead of compiling it
# twice. Used directly because `git2` has no safe wrapper for
# `GIT_OPT_SET_CACHE_OBJECT_LIMIT` (see `got-core::libgit2_opts`).
libgit2-sys = { version = "0.17.0", default-features = false }
globset = "0.4"
indicatif = "0.17"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotters = "0.3"
