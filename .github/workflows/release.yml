name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      BINARIES: git-of-theseus-analyze git-of-theseus-line-plot git-of-theseus-stack-plot git-of-theseus-survival-plot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
            archive_extension: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p got-cli

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$archive"
          for binary in $BINARIES; do
            cp "target/${{ matrix.target }}/release/${binary}${{ matrix.executable_suffix }}" "$archive/"
          done
          mkdir dist
          tar -czf "dist/${archive}.tar.gz" "$archive"

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $archive
          $binaries = $env:BINARIES.Split(" ")
          foreach ($binary in $binaries) {
            Copy-Item "target/${{ matrix.target }}/release/$binary${{ matrix.executable_suffix }}" $archive
          }
          New-Item -ItemType Directory dist
          Compress-Archive -Path $archive -DestinationPath "dist/$archive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
