name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      BINARIES: git-of-theseus-analyze git-of-theseus-line-plot git-of-theseus-stack-plot git-of-theseus-survival-plot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
            archive_extension: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libssl-dev

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p got-cli

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$archive"
          for binary in $BINARIES; do
            cp "target/${{ matrix.target }}/release/${binary}${{ matrix.executable_suffix }}" "$archive/"
          done
          mkdir dist
          tar -czf "dist/${archive}.tar.gz" "$archive"

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $archive
          $binaries = $env:BINARIES.Split(" ")
          foreach ($binary in $binaries) {
            Copy-Item "target/${{ matrix.target }}/release/$binary${{ matrix.executable_suffix }}" $archive
          }
          New-Item -ItemType Directory dist
          Compress-Archive -Path $archive -DestinationPath "dist/$archive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  update-homebrew-formula:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          pattern: "*-apple-darwin"
          merge-multiple: true

      - name: Update Formula/git-of-theseus.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          arm64_sha=$(sha256sum "dist/git-of-theseus-${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          x86_64_sha=$(sha256sum "dist/git-of-theseus-${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          python3 - "$version" "$arm64_sha" "$x86_64_sha" <<'EOF'
          import re
          import sys

          version, arm_sha, x86_sha = sys.argv[1:4]
          path = "Formula/git-of-theseus.rb"
          text = open(path).read()

          text = re.sub(r'version "[^"]*"', f'version "{version}"', text, count=1)

          def replace_block(text, block_name, sha):
              pattern = re.compile(
                  rf'({re.escape(block_name)} do.*?sha256 ")[^"]*(".*?end)', re.DOTALL
              )
              return pattern.sub(lambda m: m.group(1) + sha + m.group(2), text, count=1)

          text = replace_block(text, "on_arm", arm_sha)
          text = replace_block(text, "on_intel", x86_sha)

          open(path, "w").write(text)
          EOF

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-of-theseus.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Update Homebrew formula for ${{ github.ref_name }}"
            git push origin HEAD:master
          fi
