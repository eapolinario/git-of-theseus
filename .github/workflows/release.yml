name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      BINARIES: git-of-theseus-analyze git-of-theseus-line-plot git-of-theseus-stack-plot git-of-theseus-survival-plot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
            archive_extension: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            executable_suffix: ".exe"
            archive_extension: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          test "v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "got-core") | .version')" = "$GITHUB_REF_NAME"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libssl-dev

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p got-cli

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$archive"
          for binary in $BINARIES; do
            cp "target/${{ matrix.target }}/release/${binary}${{ matrix.executable_suffix }}" "$archive/"
          done
          mkdir dist
          tar -czf "dist/${archive}.tar.gz" "$archive"

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $archive
          $binaries = $env:BINARIES.Split(" ")
          foreach ($binary in $binaries) {
            Copy-Item "target/${{ matrix.target }}/release/$binary${{ matrix.executable_suffix }}" $archive
          }
          New-Item -ItemType Directory dist
          Compress-Archive -Path $archive -DestinationPath "dist/$archive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive_extension }}
          if-no-files-found: error

  winget-manifests:
    name: Generate and validate WinGet manifests
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          pattern: "*-pc-windows-msvc"
          merge-multiple: true

      - name: Generate and validate WinGet manifests
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace "^v", ""
          $x64Archive = "git-of-theseus-$tag-x86_64-pc-windows-msvc"
          $arm64Archive = "git-of-theseus-$tag-aarch64-pc-windows-msvc"
          $x64Url = "https://github.com/${{ github.repository }}/releases/download/$tag/$x64Archive.zip"
          $arm64Url = "https://github.com/${{ github.repository }}/releases/download/$tag/$arm64Archive.zip"
          $x64Sha256 = (Get-FileHash "dist/$x64Archive.zip" -Algorithm SHA256).Hash
          $arm64Sha256 = (Get-FileHash "dist/$arm64Archive.zip" -Algorithm SHA256).Hash
          $manifestDir = "winget-manifests/e/Eapolinario/GitOfTheseus/$version"
          New-Item -ItemType Directory -Force $manifestDir
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.yaml"
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          Installers:
            - Architecture: x64
              InstallerType: zip
              NestedInstallerType: portable
              InstallerUrl: $x64Url
              InstallerSha256: $x64Sha256
              NestedInstallerFiles:
                - RelativeFilePath: $x64Archive/git-of-theseus-analyze.exe
                  PortableCommandAlias: git-of-theseus-analyze
                - RelativeFilePath: $x64Archive/git-of-theseus-line-plot.exe
                  PortableCommandAlias: git-of-theseus-line-plot
                - RelativeFilePath: $x64Archive/git-of-theseus-stack-plot.exe
                  PortableCommandAlias: git-of-theseus-stack-plot
                - RelativeFilePath: $x64Archive/git-of-theseus-survival-plot.exe
                  PortableCommandAlias: git-of-theseus-survival-plot
            - Architecture: arm64
              InstallerType: zip
              NestedInstallerType: portable
              InstallerUrl: $arm64Url
              InstallerSha256: $arm64Sha256
              NestedInstallerFiles:
                - RelativeFilePath: $arm64Archive/git-of-theseus-analyze.exe
                  PortableCommandAlias: git-of-theseus-analyze
                - RelativeFilePath: $arm64Archive/git-of-theseus-line-plot.exe
                  PortableCommandAlias: git-of-theseus-line-plot
                - RelativeFilePath: $arm64Archive/git-of-theseus-stack-plot.exe
                  PortableCommandAlias: git-of-theseus-stack-plot
                - RelativeFilePath: $arm64Archive/git-of-theseus-survival-plot.exe
                  PortableCommandAlias: git-of-theseus-survival-plot
          ManifestType: installer
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.installer.yaml"
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: eapolinario
          PublisherUrl: https://github.com/eapolinario
          PublisherSupportUrl: https://github.com/eapolinario/git-of-theseus/issues
          PackageName: Git of Theseus
          PackageUrl: https://github.com/eapolinario/git-of-theseus
          License: Apache-2.0
          LicenseUrl: https://github.com/eapolinario/git-of-theseus/blob/$tag/LICENSE
          ShortDescription: Analyze how a Git repository grows over time.
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.locale.en-US.yaml"
          winget validate --manifest $manifestDir

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget-manifests
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, winget-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.yaml
          fail_on_unmatched_files: true
          generate_release_notes: true

  update-homebrew-formula:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          pattern: "*-apple-darwin"
          merge-multiple: true

      - name: Update Formula/git-of-theseus.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          arm64_sha=$(sha256sum "dist/git-of-theseus-${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          x86_64_sha=$(sha256sum "dist/git-of-theseus-${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          python3 - "$version" "$arm64_sha" "$x86_64_sha" <<'EOF'
          from pathlib import Path
          import sys

          version, arm_sha, x86_sha = sys.argv[1:4]
          template = Path(".github/homebrew/git-of-theseus.rb.tmpl").read_text()
          formula = (
              template.replace("@VERSION@", version)
              .replace("@ARM64_SHA256@", arm_sha)
              .replace("@X86_64_SHA256@", x86_sha)
          )
          if "@" in formula:
              raise RuntimeError("unresolved placeholder in Homebrew formula")
          path = Path("Formula/git-of-theseus.rb")
          path.parent.mkdir(exist_ok=True)
          path.write_text(formula)
          EOF

      - name: Commit and push formula update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-of-theseus.rb
          if git diff --cached --quiet; then
            printf '%s\n' "No formula changes to commit"
          else
            git commit -m "Update Homebrew formula for ${{ github.ref_name }}"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then
                exit 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                printf '%s\n' "Failed to push formula update after ${attempt} attempts" >&2
                exit 1
              fi
            done
          fi
