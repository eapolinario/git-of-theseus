name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      BINARIES: git-of-theseus-analyze git-of-theseus-line-plot git-of-theseus-stack-plot git-of-theseus-survival-plot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
            archive_extension: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libssl-dev

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p got-cli

      - name: Package Unix release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$archive"
          for binary in $BINARIES; do
            cp "target/${{ matrix.target }}/release/${binary}${{ matrix.executable_suffix }}" "$archive/"
          done
          mkdir dist
          tar -czf "dist/${archive}.tar.gz" "$archive"

      - name: Package Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "git-of-theseus-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $archive
          $binaries = $env:BINARIES.Split(" ")
          foreach ($binary in $binaries) {
            Copy-Item "target/${{ matrix.target }}/release/$binary${{ matrix.executable_suffix }}" $archive
          }
          New-Item -ItemType Directory dist
          Compress-Archive -Path $archive -DestinationPath "dist/$archive.zip"

      - name: Generate and validate WinGet manifests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace "^v", ""
          $archive = "git-of-theseus-$tag-${{ matrix.target }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$archive.zip"
          $sha256 = (Get-FileHash "dist/$archive.zip" -Algorithm SHA256).Hash
          $manifestDir = "winget-manifests/e/Eapolinario/GitOfTheseus/$version"
          New-Item -ItemType Directory -Force $manifestDir
          @"
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.yaml"
          @"
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          InstallerType: zip
          NestedInstallerType: portable
          Installers:
            - Architecture: x64
              InstallerUrl: $url
              InstallerSha256: $sha256
              NestedInstallerFiles:
                - RelativeFilePath: $archive/git-of-theseus-analyze.exe
                  PortableCommandAlias: git-of-theseus-analyze
                - RelativeFilePath: $archive/git-of-theseus-line-plot.exe
                  PortableCommandAlias: git-of-theseus-line-plot
                - RelativeFilePath: $archive/git-of-theseus-stack-plot.exe
                  PortableCommandAlias: git-of-theseus-stack-plot
                - RelativeFilePath: $archive/git-of-theseus-survival-plot.exe
                  PortableCommandAlias: git-of-theseus-survival-plot
          ManifestType: installer
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.installer.yaml"
          @"
          PackageIdentifier: Eapolinario.GitOfTheseus
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: eapolinario
          PublisherUrl: https://github.com/eapolinario
          PublisherSupportUrl: https://github.com/eapolinario/git-of-theseus/issues
          PackageName: Git of Theseus
          PackageUrl: https://github.com/eapolinario/git-of-theseus
          License: Apache-2.0
          LicenseUrl: https://github.com/eapolinario/git-of-theseus/blob/$tag/LICENSE
          ShortDescription: Analyze how a Git repository grows over time.
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          "@ | Set-Content "$manifestDir/Eapolinario.GitOfTheseus.locale.en-US.yaml"
          winget validate --manifest $manifestDir

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive_extension }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: winget-manifests
          path: winget-manifests
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/**/*.yaml
          fail_on_unmatched_files: true
          generate_release_notes: true
